name: Optimalkan gambar ke WebP ±200 KB

on:
  push:
    branches: [main]
    paths:
      - "gambar/**"
  # Tombol "Optimalkan gambar (WebP ±200 KB)" di Pages CMS → Media
  workflow_dispatch:
    inputs:
      payload:
        description: "Payload dari Pages CMS (JSON, opsional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: imgopt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang sharp
        run: npm install --prefix .github/imgopt --no-audit --no-fund

      - name: Tentukan gambar yang diproses
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Dipicu manual dari Pages CMS: memindai semua gambar."
          else
            files=$(git diff-tree --no-commit-id --name-only -r --diff-filter=AM "${{ github.sha }}" -- gambar/ | tr '\n' ' ')
            echo "files=$files" >> "$GITHUB_OUTPUT"
            if [ -z "$files" ]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "Tidak ada gambar baru pada commit ini."
            else
              echo "mode=files" >> "$GITHUB_OUTPUT"
              echo "Gambar berubah: $files"
            fi
          fi

      - name: Buat WebP ±200 KB
        if: steps.target.outputs.mode != 'none'
        run: |
          if [ "${{ steps.target.outputs.mode }}" = "all" ]; then
            node .github/imgopt/optimize.mjs --all --target-kb 200 --max-edge 1600
          else
            node .github/imgopt/optimize.mjs ${{ steps.target.outputs.files }} --target-kb 200 --max-edge 1600
          fi

      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gambar data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, tidak perlu commit."
          else
            git commit -m "chore: optimalkan gambar ke WebP ±200 KB (otomatis)"
            git push origin HEAD:main
          fi
