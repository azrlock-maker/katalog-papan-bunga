name: Kompres gambar otomatis

on:
  push:
    branches: [main]
    paths:
      - "gambar/**"
  pull_request:
    branches: [main]
    paths:
      - "gambar/**"

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Kompres gambar
        uses: calibreapp/image-actions@v1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jpegQuality: 82
          pngQuality: 85
          webpQuality: 82
          ignorePaths: "gambar-backup/**"