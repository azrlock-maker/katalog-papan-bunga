# Konfigurasi deploy Netlify (gratis).
# Setelah repository terhubung, Netlify otomatis menjalankan "node build.js"
# setiap kali ada perubahan, lalu menayangkan isi folder dist/.

[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/aset/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/gambar/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
